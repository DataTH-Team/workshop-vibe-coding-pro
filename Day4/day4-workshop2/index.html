<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e879f9">
  <title>Cafe Assistant · ถามยอดขาย</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --surface: rgba(255, 255, 255, 0.82);
      --surface-solid: #ffffff;
      --text: #1a1025;
      --muted: #6b6280;
      --border: rgba(255, 255, 255, 0.55);
      --accent: #7c3aed;
      --accent-2: #ec4899;
      --chip-bg: rgba(255, 255, 255, 0.72);
      --input-bg: rgba(255, 252, 248, 0.92);
      --shadow: 0 8px 32px rgba(88, 28, 135, 0.18);
      --shadow-soft: 0 2px 16px rgba(88, 28, 135, 0.1);
      --radius: 18px;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Thai", sans-serif;
      color: var(--text);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background:
        radial-gradient(ellipse 90% 70% at 15% 20%, #ff6eb4 0%, transparent 55%),
        radial-gradient(ellipse 80% 60% at 85% 15%, #7eb8ff 0%, transparent 50%),
        radial-gradient(ellipse 70% 65% at 70% 85%, #ff9a6c 0%, transparent 50%),
        radial-gradient(ellipse 85% 75% at 25% 75%, #c084fc 0%, transparent 55%),
        radial-gradient(ellipse 60% 50% at 50% 45%, #f472b6 0%, transparent 60%),
        linear-gradient(145deg, #fda4af 0%, #e879f9 28%, #a78bfa 55%, #60a5fa 78%, #fb923c 100%);
      background-attachment: fixed;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 720px;
      margin: 0 auto;
      position: relative;
    }

    @media (min-width: 768px) {
      .app {
        margin-top: 28px;
        margin-bottom: 28px;
        height: calc(100dvh - 56px);
        border-radius: 28px;
        background: var(--surface);
        backdrop-filter: blur(24px) saturate(1.4);
        -webkit-backdrop-filter: blur(24px) saturate(1.4);
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
        overflow: hidden;
      }
    }

    /* Header */
    header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 18px;
      padding-top: calc(16px + env(safe-area-inset-top));
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.45);
    }

    @media (max-width: 767px) {
      header {
        background: rgba(255, 255, 255, 0.35);
      }
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f472b6, #a78bfa);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      box-shadow: 0 4px 14px rgba(168, 85, 247, 0.35);
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header p {
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 500;
    }

    .badge {
      margin-left: auto;
      font-size: 0.65rem;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      color: #fff;
      padding: 5px 11px;
      border-radius: 999px;
      font-weight: 600;
      white-space: nowrap;
      box-shadow: 0 2px 10px rgba(236, 72, 153, 0.35);
    }

    /* Chat area */
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .msg {
      display: flex;
      gap: 8px;
      max-width: 92%;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.bot { align-self: flex-start; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }

    .msg-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--surface-solid);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      flex-shrink: 0;
      margin-top: 2px;
      box-shadow: var(--shadow-soft);
    }

    .msg.user .msg-avatar {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      box-shadow: 0 2px 10px rgba(99, 102, 241, 0.35);
    }

    .bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 0.9rem;
      word-break: break-word;
    }

    .msg.bot .bubble {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-top-left-radius: 5px;
      box-shadow: var(--shadow-soft);
    }

    .msg.user .bubble {
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      color: #fff;
      border-top-right-radius: 5px;
      box-shadow: 0 4px 18px rgba(168, 85, 247, 0.35);
    }

    .msg.bot .bubble.error {
      background: rgba(254, 226, 226, 0.92);
      border-color: rgba(248, 113, 113, 0.45);
      color: #7f1d1d;
    }

    .bubble strong { font-weight: 700; }
    .bubble ul { margin: 6px 0 0 18px; }
    .bubble li { margin: 3px 0; }

    .time {
      font-size: 0.65rem;
      color: rgba(255, 255, 255, 0.75);
      margin-top: 4px;
      padding: 0 4px;
    }

    .msg.bot .time { color: var(--muted); }
    .msg.user .time { text-align: right; color: rgba(255,255,255,0.55); }

    /* Typing indicator */
    .typing .bubble {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 14px 18px;
    }

    .dot-anim {
      width: 7px;
      height: 7px;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
      opacity: 0.6;
    }
    .dot-anim:nth-child(2) { animation-delay: 0.15s; }
    .dot-anim:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    /* Quick chips */
    .chips-wrap {
      flex-shrink: 0;
      padding: 0 16px 10px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .chips-wrap::-webkit-scrollbar { display: none; }

    .chips {
      display: flex;
      gap: 8px;
      width: max-content;
      max-width: 100%;
    }

    .chip {
      flex-shrink: 0;
      background: var(--chip-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.65);
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 500;
      padding: 9px 16px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
      font-family: inherit;
      box-shadow: var(--shadow-soft);
    }

    .chip:hover {
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 4px 16px rgba(168, 85, 247, 0.15);
    }
    .chip:active { transform: scale(0.97); }
    .chip:disabled { opacity: 0.45; cursor: not-allowed; }

    /* Input bar */
    .input-bar {
      flex-shrink: 0;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      padding: 12px 16px 16px;
      padding-bottom: calc(16px + env(safe-area-inset-bottom));
      background: transparent;
    }

    .input-wrap {
      flex: 1;
      background: var(--input-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 20px;
      padding: 12px 16px;
      transition: border-color 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 24px rgba(88, 28, 135, 0.12);
    }

    .input-wrap:focus-within {
      border-color: rgba(168, 85, 247, 0.5);
      box-shadow: 0 4px 28px rgba(168, 85, 247, 0.22);
    }

    textarea {
      width: 100%;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text);
      resize: none;
      outline: none;
      max-height: 100px;
      line-height: 1.4;
    }

    textarea::placeholder { color: #9ca3af; }

    .send-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1a1025 0%, #4c1d95 100%);
      color: white;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.1s, box-shadow 0.15s;
      box-shadow: 0 4px 16px rgba(26, 16, 37, 0.35);
    }

    .send-btn:hover {
      box-shadow: 0 6px 22px rgba(76, 29, 149, 0.45);
    }
    .send-btn:active { transform: scale(0.94); }
    .send-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .send-btn svg { width: 20px; height: 20px; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="avatar">☕</div>
      <div>
        <h1>Cafe Assistant</h1>
        <p>ถามยอดขาย · คุยกับ Gemini</p>
      </div>
      <span class="badge">Gemini</span>
    </header>

    <div class="chat" id="chat" role="log" aria-live="polite"></div>

    <div class="chips-wrap">
      <div class="chips" id="chips"></div>
    </div>

    <form class="input-bar" id="form">
      <div class="input-wrap">
        <textarea id="input" rows="1" placeholder="พิมพ์คำถาม เช่น เมนูไหนขายดีสัปดาห์ที่แล้ว?" aria-label="พิมพ์คำถาม"></textarea>
      </div>
      <button type="submit" class="send-btn" id="sendBtn" aria-label="ส่ง">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </form>
  </div>

  <script>
    const QUICK_QUESTIONS = [
      'ยอดขายสัปดาห์ที่แล้วเท่าไหร่?',
      'เมนูไหนขายดีที่สุด?',
      'แยกตามหมวดหมู่',
      'ช่องทางไหนขายดี?',
      'วันไหนยอดสูงสุด?',
      'เมื่อวานขายได้เท่าไหร่?',
    ];

    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const form = document.getElementById('form');
    const chipsEl = document.getElementById('chips');
    const sendBtn = document.getElementById('sendBtn');
    const history = [];
    let busy = false;

    function nowTime() {
      return new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function formatReply(text) {
      return escapeHtml(text)
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');
    }

    function addMessage(role, html, isError) {
      const wrap = document.createElement('div');
      wrap.className = `msg ${role}`;
      wrap.innerHTML = `
        <div class="msg-avatar">${role === 'bot' ? '☕' : '🧑'}</div>
        <div>
          <div class="bubble${isError ? ' error' : ''}">${html}</div>
          <div class="time">${nowTime()}</div>
        </div>`;
      chat.appendChild(wrap);
      chat.scrollTop = chat.scrollHeight;
      return wrap;
    }

    function showTyping() {
      const el = document.createElement('div');
      el.className = 'msg bot typing';
      el.id = 'typing';
      el.innerHTML = `
        <div class="msg-avatar">☕</div>
        <div class="bubble">
          <span class="dot-anim"></span>
          <span class="dot-anim"></span>
          <span class="dot-anim"></span>
        </div>`;
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
      return el;
    }

    function hideTyping() {
      document.getElementById('typing')?.remove();
    }

    function setBusy(next) {
      busy = next;
      sendBtn.disabled = next;
      input.disabled = next;
      chipsEl.querySelectorAll('.chip').forEach(btn => { btn.disabled = next; });
    }

    async function askGemini(message) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 30000);
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, history }),
          signal: ctrl.signal,
        });
        let data = {};
        try {
          data = await res.json();
        } catch {
          throw new Error('เซิร์ฟเวอร์ตอบกลับมาไม่ถูกต้อง');
        }
        if (!res.ok) throw new Error(data.error || 'ส่งคำถามไม่สำเร็จ');
        if (!data.reply) throw new Error('Gemini ไม่ได้ส่งคำตอบกลับมา');
        return data.reply;
      } catch (err) {
        if (err && err.name === 'AbortError') {
          throw new Error('รอคำตอบนานเกินไป ลองส่งใหม่อีกครั้งครับ');
        }
        throw err;
      } finally {
        clearTimeout(timer);
      }
    }

    async function sendMessage(text) {
      const q = text.trim();
      if (!q || busy) return;

      addMessage('user', escapeHtml(q));
      input.value = '';
      input.style.height = 'auto';
      setBusy(true);
      showTyping();

      try {
        const reply = await askGemini(q);
        addMessage('bot', formatReply(reply));
        history.push({ role: 'user', text: q });
        history.push({ role: 'bot', text: reply });
      } catch (err) {
        const msg = err && err.name === 'AbortError'
          ? 'รอคำตอบนานเกินไป ลองส่งใหม่อีกครั้งครับ'
          : err instanceof TypeError
            ? 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ — เปิดผ่าน serve.command นะครับ (อย่าเปิดไฟล์ index.html ตรง ๆ)'
            : (err.message || 'มีข้อผิดพลาด');
        addMessage('bot', formatReply(msg), true);
      } finally {
        hideTyping();
        setBusy(false);
        input.focus();
      }
    }

    QUICK_QUESTIONS.forEach(q => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'chip';
      btn.textContent = q;
      btn.addEventListener('click', () => sendMessage(q));
      chipsEl.appendChild(btn);
    });

    form.addEventListener('submit', e => {
      e.preventDefault();
      sendMessage(input.value);
    });

    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 100) + 'px';
    });

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage(input.value);
      }
    });

    addMessage('bot',
      `สวัสดีครับ ☕ ยินดีต้อนรับเจ้าของร้าน!<br><br>
      ตอนนี้คุยกับ <strong>Gemini</strong> ได้จริงแล้ว
      ลองกดคำถามด้านล่าง หรือพิมพ์ถามได้เลยครับ`
    );

    fetch('/api/health')
      .then(r => r.json())
      .then(data => {
        if (data.configured === false) {
          addMessage('bot',
            formatReply('ยังไม่มี API Key ในไฟล์ .env\nคัดลอก .env.example เป็น .env แล้วใส่ Gemini API Key ก่อนใช้งานครับ'),
            true
          );
        }
      })
      .catch(() => {
        addMessage('bot',
          formatReply('เชื่อมต่อ backend ไม่ได้ — ดับเบิลคลิก serve.command เพื่อเปิดเซิร์ฟเวอร์ครับ'),
          true
        );
      });
  </script>
</body>
</html>
