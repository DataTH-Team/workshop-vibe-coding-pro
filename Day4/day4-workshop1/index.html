<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e879f9">
  <title>Cafe Assistant · ถามยอดขาย</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --surface: rgba(255, 255, 255, 0.82);
      --surface-solid: #ffffff;
      --text: #1a1025;
      --muted: #6b6280;
      --border: rgba(255, 255, 255, 0.55);
      --accent: #7c3aed;
      --accent-2: #ec4899;
      --chip-bg: rgba(255, 255, 255, 0.72);
      --input-bg: rgba(255, 252, 248, 0.92);
      --shadow: 0 8px 32px rgba(88, 28, 135, 0.18);
      --shadow-soft: 0 2px 16px rgba(88, 28, 135, 0.1);
      --radius: 18px;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Thai", sans-serif;
      color: var(--text);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background:
        radial-gradient(ellipse 90% 70% at 15% 20%, #ff6eb4 0%, transparent 55%),
        radial-gradient(ellipse 80% 60% at 85% 15%, #7eb8ff 0%, transparent 50%),
        radial-gradient(ellipse 70% 65% at 70% 85%, #ff9a6c 0%, transparent 50%),
        radial-gradient(ellipse 85% 75% at 25% 75%, #c084fc 0%, transparent 55%),
        radial-gradient(ellipse 60% 50% at 50% 45%, #f472b6 0%, transparent 60%),
        linear-gradient(145deg, #fda4af 0%, #e879f9 28%, #a78bfa 55%, #60a5fa 78%, #fb923c 100%);
      background-attachment: fixed;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 720px;
      margin: 0 auto;
      position: relative;
    }

    @media (min-width: 768px) {
      .app {
        margin-top: 28px;
        margin-bottom: 28px;
        height: calc(100dvh - 56px);
        border-radius: 28px;
        background: var(--surface);
        backdrop-filter: blur(24px) saturate(1.4);
        -webkit-backdrop-filter: blur(24px) saturate(1.4);
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
        overflow: hidden;
      }
    }

    /* Header */
    header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 18px;
      padding-top: calc(16px + env(safe-area-inset-top));
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.45);
    }

    @media (max-width: 767px) {
      header {
        background: rgba(255, 255, 255, 0.35);
      }
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f472b6, #a78bfa);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      box-shadow: 0 4px 14px rgba(168, 85, 247, 0.35);
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header p {
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 500;
    }

    .badge {
      margin-left: auto;
      font-size: 0.65rem;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      color: #fff;
      padding: 5px 11px;
      border-radius: 999px;
      font-weight: 600;
      white-space: nowrap;
      box-shadow: 0 2px 10px rgba(236, 72, 153, 0.35);
    }

    /* Chat area */
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .msg {
      display: flex;
      gap: 8px;
      max-width: 92%;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.bot { align-self: flex-start; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }

    .msg-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--surface-solid);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      flex-shrink: 0;
      margin-top: 2px;
      box-shadow: var(--shadow-soft);
    }

    .msg.user .msg-avatar {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      box-shadow: 0 2px 10px rgba(99, 102, 241, 0.35);
    }

    .bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 0.9rem;
      word-break: break-word;
    }

    .msg.bot .bubble {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-top-left-radius: 5px;
      box-shadow: var(--shadow-soft);
    }

    .msg.user .bubble {
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      color: #fff;
      border-top-right-radius: 5px;
      box-shadow: 0 4px 18px rgba(168, 85, 247, 0.35);
    }

    .bubble strong { font-weight: 700; }
    .bubble ul { margin: 6px 0 0 18px; }
    .bubble li { margin: 3px 0; }
    .bubble .stat-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 5px 0;
      border-bottom: 1px solid rgba(124, 58, 237, 0.12);
      font-size: 0.85rem;
    }
    .bubble .stat-row:last-child { border-bottom: none; }
    .bubble .highlight {
      background: linear-gradient(135deg, #7c3aed, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
    }

    .time {
      font-size: 0.65rem;
      color: rgba(255, 255, 255, 0.75);
      margin-top: 4px;
      padding: 0 4px;
    }

    .msg.bot .time { color: var(--muted); }
    .msg.user .time { text-align: right; color: rgba(255,255,255,0.55); }

    /* Typing indicator */
    .typing .bubble {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 14px 18px;
    }

    .dot-anim {
      width: 7px;
      height: 7px;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
      opacity: 0.6;
    }
    .dot-anim:nth-child(2) { animation-delay: 0.15s; }
    .dot-anim:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    /* Quick chips */
    .chips-wrap {
      flex-shrink: 0;
      padding: 0 16px 10px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .chips-wrap::-webkit-scrollbar { display: none; }

    .chips {
      display: flex;
      gap: 8px;
      width: max-content;
      max-width: 100%;
    }

    .chip {
      flex-shrink: 0;
      background: var(--chip-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.65);
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 500;
      padding: 9px 16px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
      font-family: inherit;
      box-shadow: var(--shadow-soft);
    }

    .chip:hover {
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 4px 16px rgba(168, 85, 247, 0.15);
    }
    .chip:active { transform: scale(0.97); }

    /* Input bar */
    .input-bar {
      flex-shrink: 0;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      padding: 12px 16px 16px;
      padding-bottom: calc(16px + env(safe-area-inset-bottom));
      background: transparent;
    }

    .input-wrap {
      flex: 1;
      background: var(--input-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 20px;
      padding: 12px 16px;
      transition: border-color 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 24px rgba(88, 28, 135, 0.12);
    }

    .input-wrap:focus-within {
      border-color: rgba(168, 85, 247, 0.5);
      box-shadow: 0 4px 28px rgba(168, 85, 247, 0.22);
    }

    textarea {
      width: 100%;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text);
      resize: none;
      outline: none;
      max-height: 100px;
      line-height: 1.4;
    }

    textarea::placeholder { color: #9ca3af; }

    .send-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1a1025 0%, #4c1d95 100%);
      color: white;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.1s, box-shadow 0.15s;
      box-shadow: 0 4px 16px rgba(26, 16, 37, 0.35);
    }

    .send-btn:hover {
      box-shadow: 0 6px 22px rgba(76, 29, 149, 0.45);
    }
    .send-btn:active { transform: scale(0.94); }
    .send-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .send-btn svg { width: 20px; height: 20px; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="avatar">☕</div>
      <div>
        <h1>Cafe Assistant</h1>
        <p>ถามยอดขาย · เมนูขายดี · ช่องทางขาย</p>
      </div>
      <span class="badge">Demo</span>
    </header>

    <div class="chat" id="chat" role="log" aria-live="polite"></div>

    <div class="chips-wrap">
      <div class="chips" id="chips"></div>
    </div>

    <form class="input-bar" id="form">
      <div class="input-wrap">
        <textarea id="input" rows="1" placeholder="พิมพ์คำถาม เช่น เมนูไหนขายดีสัปดาห์ที่แล้ว?" aria-label="พิมพ์คำถาม"></textarea>
      </div>
      <button type="submit" class="send-btn" id="sendBtn" aria-label="ส่ง">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </form>
  </div>

  <script>
    /* ── ข้อมูลตัวอย่าง (ยังไม่เชื่อม API จริง) ── */
    const SAMPLE = {
      lastWeek: {
        period: '10–16 ส.ค. 2026',
        revenue: 5090,
        orders: 37,
        qty: 91,
        topMenus: [
          { name: 'Iced Americano', qty: 22, revenue: 1210 },
          { name: 'Iced Latte', qty: 16, revenue: 1040 },
          { name: 'Thai Iced Tea', qty: 11, revenue: 605 },
          { name: 'Lemon Soda', qty: 8, revenue: 360 },
          { name: 'Lemon Tea', qty: 7, revenue: 350 },
        ],
        categories: [
          { name: 'Coffee', revenue: 2520, pct: 49 },
          { name: 'Tea', revenue: 1280, pct: 25 },
          { name: 'Other Drinks', revenue: 780, pct: 15 },
          { name: 'Snacks', revenue: 510, pct: 11 },
        ],
        channels: [
          { name: 'Walk-in', orders: 26, revenue: 3445 },
          { name: 'Delivery', orders: 10, revenue: 1515 },
          { name: 'Pre-order', orders: 1, revenue: 130 },
        ],
        daily: [
          { day: 'จ. 10', revenue: 520 },
          { day: 'อ. 11', revenue: 890 },
          { day: 'พ. 12', revenue: 640 },
          { day: 'พฤ. 13', revenue: 710 },
          { day: 'ศ. 14', revenue: 980 },
          { day: 'ส. 15', revenue: 850 },
          { day: 'อา. 16', revenue: 500 },
        ],
        bestDay: { day: 'ศ. 14 ส.ค.', revenue: 980 },
        worstDay: { day: 'อา. 16 ส.ค.', revenue: 500 },
      },
      thisMonth: {
        period: 'ส.ค. 2026 (1–16 ส.ค.)',
        revenue: 5090,
        orders: 37,
        avgPerDay: 318,
      },
      yesterday: {
        date: '16 ส.ค. 2026',
        revenue: 500,
        orders: 4,
        top: 'Iced Americano (3 แก้ว)',
      },
    };

    const QUICK_QUESTIONS = [
      'ยอดขายสัปดาห์ที่แล้วเท่าไหร่?',
      'เมนูไหนขายดีที่สุด?',
      'แยกตามหมวดหมู่',
      'ช่องทางไหนขายดี?',
      'วันไหนยอดสูงสุด?',
      'เมื่อวานขายได้เท่าไหร่?',
    ];

    /* ── คำตอบตัวอย่าง (จับคีย์เวิร์ด) ── */
    const RESPONSES = [
      {
        keywords: ['สัปดาห์', 'week', '7 วัน', 'อาทิตย์'],
        exclude: ['เมนู', 'หมวด', 'ช่องทาง', 'วัน'],
        reply: () => {
          const w = SAMPLE.lastWeek;
          return `📊 <strong>ยอดขายสัปดาห์ที่แล้ว</strong> (${w.period})<br><br>
            <div class="stat-row"><span>ยอดขายรวม</span><span class="highlight">${fmt(w.revenue)}</span></div>
            <div class="stat-row"><span>จำนวนออเดอร์</span><span class="highlight">${w.orders} ออเดอร์</span></div>
            <div class="stat-row"><span>แก้ว/ชิ้น</span><span class="highlight">${w.qty} ชิ้น</span></div>
            <br>เฉลี่ยต่อวัน ~ <strong>${fmt(Math.round(w.revenue / 7))}</strong>`;
        },
      },
      {
        keywords: ['เมนู', 'ขายดี', 'best', 'top', 'popular', 'ฮิต'],
        reply: () => {
          const items = SAMPLE.lastWeek.topMenus
            .map((m, i) => `<li><strong>${i + 1}. ${m.name}</strong> — ${m.qty} แก้ว/ชิ้น (${fmt(m.revenue)})</li>`)
            .join('');
          return `🏆 <strong>เมนูขายดี Top 5</strong> (สัปดาห์ที่แล้ว)<br><ul>${items}</ul>
            <br>💡 <strong>Iced Americano</strong> นำโด่ง 22 แก้ว — คิดเป็น 24% ของยอดทั้งหมด`;
        },
      },
      {
        keywords: ['หมวด', 'category', 'กาแฟ', 'coffee', 'ชา', 'tea', 'snack'],
        reply: () => {
          const rows = SAMPLE.lastWeek.categories
            .map(c => `<div class="stat-row"><span>${c.name}</span><span class="highlight">${fmt(c.revenue)} (${c.pct}%)</span></div>`)
            .join('');
          return `🗂️ <strong>ยอดขายแยกตามหมวด</strong> (สัปดาห์ที่แล้ว)<br><br>${rows}
            <br>หมวด <strong>Coffee</strong> ทำรายได้สูงสุด เกือบครึ่งหนึ่งของยอดรวม`;
        },
      },
      {
        keywords: ['ช่องทาง', 'walk-in', 'delivery', 'pre-order', 'ส่ง', 'หน้าร้าน', 'เดลิเวอรี่'],
        reply: () => {
          const rows = SAMPLE.lastWeek.channels
            .map(c => `<div class="stat-row"><span>${c.name}</span><span class="highlight">${c.orders} ออเดอร์ · ${fmt(c.revenue)}</span></div>`)
            .join('');
          return `📱 <strong>ยอดขายแยกช่องทาง</strong> (สัปดาห์ที่แล้ว)<br><br>${rows}
            <br>ลูกค้า <strong>Walk-in</strong> ยังเป็นหลัก 68% ของยอดขาย`;
        },
      },
      {
        keywords: ['วัน', 'daily', 'รายวัน', 'สูงสุด', 'ต่ำสุด', 'peak'],
        reply: () => {
          const w = SAMPLE.lastWeek;
          const bars = w.daily
            .map(d => `<div class="stat-row"><span>${d.day}</span><span class="highlight">${fmt(d.revenue)}</span></div>`)
            .join('');
          return `📅 <strong>ยอดขายรายวัน</strong> (${w.period})<br><br>${bars}
            <br>🔺 วันยอดสูงสุด: <strong>${w.bestDay.day}</strong> (${fmt(w.bestDay.revenue)})
            <br>🔻 วันยอดต่ำสุด: <strong>${w.worstDay.day}</strong> (${fmt(w.worstDay.revenue)})`;
        },
      },
      {
        keywords: ['เมื่อวาน', 'yesterday', 'วาน'],
        reply: () => {
          const y = SAMPLE.yesterday;
          return `📆 <strong>ยอดขายเมื่อวาน</strong> (${y.date})<br><br>
            <div class="stat-row"><span>ยอดขาย</span><span class="highlight">${fmt(y.revenue)}</span></div>
            <div class="stat-row"><span>ออเดอร์</span><span class="highlight">${y.orders} ออเดอร์</span></div>
            <div class="stat-row"><span>เมนูขายดี</span><span class="highlight">${y.top}</span></div>
            <br>วันอาทิตย์ยอดมักช้ากว่าวันธรรมดา`;
        },
      },
      {
        keywords: ['เดือน', 'month', 'สิงหา', 'august'],
        reply: () => {
          const m = SAMPLE.thisMonth;
          return `📈 <strong>ยอดขายเดือนนี้</strong> (${m.period})<br><br>
            <div class="stat-row"><span>ยอดขายรวม</span><span class="highlight">${fmt(m.revenue)}</span></div>
            <div class="stat-row"><span>ออเดอร์</span><span class="highlight">${m.orders} ออเดอร์</span></div>
            <div class="stat-row"><span>เฉลี่ย/วัน</span><span class="highlight">${fmt(m.avgPerDay)}</span></div>
            <br><em>หมายเหตุ: ข้อมูล demo ครอบคลุม 1–16 ส.ค. 2026</em>`;
        },
      },
      {
        keywords: ['สวัสดี', 'hello', 'hi', 'หวัดดี', 'hey'],
        reply: () =>
          `สวัสดีครับ ☕ ผมช่วยสรุปยอดขายร้าน Cafe ให้ได้เลย<br><br>
          ลองถาม เช่น:<br>
          • "ยอดขายสัปดาห์ที่แล้วเท่าไหร่?"<br>
          • "เมนูไหนขายดี?"<br>
          • "Walk-in กับ Delivery อันไหนมากกว่า?"`,
      },
      {
        keywords: ['ช่วย', 'help', 'ถามอะไร', 'ทำอะไร'],
        reply: () =>
          `🤖 <strong>Cafe Assistant</strong> (Demo) ตอบคำถามจากข้อมูลตัวอย่างได้ เช่น:<br><br>
          📊 ยอดขายรวม / ออเดอร์<br>
          🏆 เมนูขายดี Top 5<br>
          🗂️ แยกตามหมวด (Coffee, Tea, Snacks…)<br>
          📱 ช่องทาง Walk-in / Delivery<br>
          📅 ยอดขายรายวัน<br><br>
          กดปุ่มคำถามด้านล่าง หรือพิมพ์เองได้เลย`,
      },
    ];

    const FALLBACK =
      `ขอโทษครับ ยังตอบคำถามนี้ไม่ได้ในโหมด Demo 😅<br><br>
      ลองถามเรื่องเหล่านี้ดูนะครับ:<br>
      • ยอดขายสัปดาห์ที่แล้ว<br>
      • เมนูขายดี<br>
      • แยกตามหมวด / ช่องทาง<br>
      • ยอดขายรายวัน`;

    /* ── UI helpers ── */
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const form = document.getElementById('form');
    const chipsEl = document.getElementById('chips');

    function fmt(n) {
      return '฿' + n.toLocaleString('th-TH');
    }

    function nowTime() {
      return new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
    }

    function addMessage(role, html) {
      const wrap = document.createElement('div');
      wrap.className = `msg ${role}`;
      wrap.innerHTML = `
        <div class="msg-avatar">${role === 'bot' ? '☕' : '🧑'}</div>
        <div>
          <div class="bubble">${html}</div>
          <div class="time">${nowTime()}</div>
        </div>`;
      chat.appendChild(wrap);
      chat.scrollTop = chat.scrollHeight;
      return wrap;
    }

    function showTyping() {
      const el = document.createElement('div');
      el.className = 'msg bot typing';
      el.id = 'typing';
      el.innerHTML = `
        <div class="msg-avatar">☕</div>
        <div class="bubble">
          <span class="dot-anim"></span>
          <span class="dot-anim"></span>
          <span class="dot-anim"></span>
        </div>`;
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
      return el;
    }

    function hideTyping() {
      document.getElementById('typing')?.remove();
    }

    function matchReply(text) {
      const q = text.toLowerCase().trim();
      for (const r of RESPONSES) {
        if (r.exclude?.some(ex => q.includes(ex))) continue;
        if (r.keywords.some(kw => q.includes(kw))) return r.reply();
      }
      for (const r of RESPONSES) {
        if (r.keywords.some(kw => q.includes(kw))) return r.reply();
      }
      return FALLBACK;
    }

    function sendMessage(text) {
      const q = text.trim();
      if (!q) return;

      addMessage('user', q.replace(/</g, '&lt;'));
      input.value = '';
      input.style.height = 'auto';
      document.getElementById('sendBtn').disabled = true;

      showTyping();
      const delay = 600 + Math.random() * 500;
      setTimeout(() => {
        hideTyping();
        addMessage('bot', matchReply(q));
        document.getElementById('sendBtn').disabled = false;
        input.focus();
      }, delay);
    }

    /* ── Init ── */
    QUICK_QUESTIONS.forEach(q => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'chip';
      btn.textContent = q;
      btn.addEventListener('click', () => sendMessage(q));
      chipsEl.appendChild(btn);
    });

    form.addEventListener('submit', e => {
      e.preventDefault();
      sendMessage(input.value);
    });

    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 100) + 'px';
    });

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage(input.value);
      }
    });

    addMessage('bot',
      `สวัสดีครับ ☕ ยินดีต้อนรับเจ้าของร้าน!<br><br>
      ผมช่วยสรุป<strong>ยอดขาย</strong>จากข้อมูลตัวอย่างให้ได้เลย
      ลองกดคำถามด้านล่าง หรือพิมพ์ถามได้เลยครับ`
    );
  </script>
</body>
</html>
